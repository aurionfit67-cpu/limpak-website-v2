// LIMEPAK Android App Build Configuration
// Generated by Capacitor

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.limepak.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.limepak.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Capacitor configuration
        def capSettings = rootProject.ext.get('capacitor') ?: new gradle.api.internal.HashMap()
        
        // App name
        resValue "string", "app_name", "LIMEPAK"
        resValue "string", "app_version", "1.0.0"
        resValue "string", "app_id", "com.limepak.app"
        resValue "string", "app_build", "1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storePassword 'android'
        }
        
        release {
            // Configure your release signing here
            // storeFile file('release.keystore')
            // keyAlias 'your_key_alias'
            // keyPassword 'your_key_password'
            // storePassword 'your_store_password'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        pickFirst 'META-INF/AL2.0'
        pickFirst 'META-INF/LGPL2.1'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.webkit:webkit:1.8.0"
    implementation "androidx.lifecycle:lifecycle-process:2.6.1"
    implementation "com.google.android.material:material:1.9.0"
    
    // Capacitor dependencies
    implementation "androidx.annotation:annotation:1.6.0"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "androidx.biometric:biometric:1.1.0"
    
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Apply Capacitor plugins
apply from: "../../capacitor-cordova-android-plugins/src/main/groovy/com/getcapacitor/Plugin.gradle"
